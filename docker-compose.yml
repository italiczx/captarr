name: captarr

services:
  captarr:
    image: jamesangier/captarr:latest
    container_name: captarr
    build: .
    ports:
      - "8787:8787"
    environment:
      DATA_DIR: /data
      PORT: 8787
      # Synology and other NAS hosts: set these to the user that should own /data.
      # PUID: "1026"
      # PGID: "100"
    volumes:
      - ./data:/data
    restart: unless-stopped
